    <script>
      const tl = gsap.timeline({ paused: true });
      const glow = document.getElementById("audio-glow");
      const audio = window.AUDIO_DATA;

      tl.fromTo(
        "#o-red",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out", transformOrigin: "50% 50%" },
        0.5
      );
      tl.fromTo(
        "#o-white",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out", transformOrigin: "50% 50%" },
        1.09
      );
      tl.fromTo("#s1-inner", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.inOut" }, 5.0);

      tl.fromTo(
        "#s2-inner",
        { opacity: 0 },
        { opacity: 1, duration: 0.7, ease: "power2.inOut", immediateRender: false },
        5.0
      );
      tl.fromTo(
        "#hero-line",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", immediateRender: false },
        5.25
      );
      tl.fromTo(
        "#hero-art",
        { scale: 1.0 },
        { scale: 1.045, duration: 5.5, ease: "none", transformOrigin: "50% 100%", immediateRender: false },
        5.0
      );
      tl.fromTo(
        "#s2-inner",
        { opacity: 1 },
        { opacity: 0, duration: 0.7, ease: "power2.inOut", immediateRender: false },
        10.0
      );

      tl.fromTo(
        "#s3-inner",
        { opacity: 0 },
        { opacity: 1, duration: 0.7, ease: "power2.inOut", immediateRender: false },
        10.0
      );
      tl.fromTo(
        "#work-eyebrow",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false },
        10.35
      );
      // beat-grid: plate 1 at 10.93s, plate 2 at 11.46s, plate 3 at 12.02s, plate 4 at 12.55s
      const plates = ["#col-pred", "#col-voice", "#col-ind", "#col-custom"];
      const plateTimes = [10.93, 11.46, 12.02, 12.55];
      plates.forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false },
          plateTimes[i]
        );
      });
      tl.fromTo(
        "#s3-inner",
        { opacity: 1 },
        { opacity: 0, duration: 0.7, ease: "power2.inOut", immediateRender: false },
        16.0
      );

      tl.fromTo(
        "#s4-inner",
        { opacity: 0 },
        { opacity: 1, duration: 0.7, ease: "power2.inOut", immediateRender: false },
        16.0
      );
      tl.fromTo(
        "#manifesto",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power3.out", immediateRender: false },
        16.25
      );
      // beat-locked: 17.47s manifesto hold
      tl.fromTo(
        "#manifesto",
        { opacity: 1 },
        { opacity: 0, duration: 0.4, ease: "power2.inOut", immediateRender: false },
        18.85
      );
      tl.fromTo(
        "#lockup",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false },
        18.95
      );

      function sampleAudio() {
        if (!audio || !glow) return;
        const t = tl.time();
        const f = Math.min(audio.totalFrames - 1, Math.max(0, Math.round(t * audio.fps)));
        const rms = audio.rms[f] || 0;
        const bass = audio.bass[f] || 0;
        gsap.set(glow, {
          opacity: 0.2 + bass * 0.22,
          scale: 1 + rms * 0.045,
        });
      }
      tl.eventCallback("onUpdate", sampleAudio);

      window.__timelines["main"] = tl;
      tl.seek(0);
      sampleAudio();
    </script>
