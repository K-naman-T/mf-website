<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -20 860 760" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background: #06060A;">
  <defs>
    <!-- Ultra intense multi-layer Vice City neon glow filter -->
    <filter id="vc-neon-filter" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feGaussianBlur stdDeviation="16" result="blur3" />
      <feGaussianBlur stdDeviation="32" result="blur4" />
      <feMerge>
        <feMergeNode in="blur4" />
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="vc-ambient-radial" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FF003C" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#FF003C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="vc-glass-black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822" />
      <stop offset="50%" stop-color="#0A0A0F" />
      <stop offset="100%" stop-color="#020205" />
    </linearGradient>

    <style>
      @keyframes vcPowerIgnition {
        0% { opacity: 0.05; filter: drop-shadow(0 0 0 rgba(255,0,60,0)); }
        3% { opacity: 0.85; filter: drop-shadow(0 0 10px #FF003C); }
        5% { opacity: 0.12; filter: drop-shadow(0 0 1px rgba(255,0,60,0.2)); }
        8% { opacity: 0.95; filter: drop-shadow(0 0 20px #FF003C); }
        11% { opacity: 0.25; }
        16% { opacity: 1; filter: drop-shadow(0 0 30px #FF003C); }
        20% { opacity: 0.45; }
        24% { opacity: 1; filter: drop-shadow(0 0 35px #FF003C); }
        72% { opacity: 0.98; }
        73% { opacity: 0.75; }
        74% { opacity: 1; filter: drop-shadow(0 0 40px #FF003C); }
        100% { opacity: 1; filter: drop-shadow(0 0 35px #FF003C); }
      }

      @keyframes vcNeonHum {
        0%, 100% {
          opacity: 0.95;
          filter: drop-shadow(0 0 6px #FF003C) drop-shadow(0 0 18px rgba(255,0,60,0.85)) drop-shadow(0 0 35px rgba(255,0,60,0.45));
        }
        50% {
          opacity: 1;
          filter: drop-shadow(0 0 12px #FF003C) drop-shadow(0 0 28px rgba(255,0,60,0.95)) drop-shadow(0 0 55px rgba(255,0,60,0.65));
        }
      }

      @keyframes vcMicroFlicker {
        0%, 100% { opacity: 1; }
        38% { opacity: 1; }
        39% { opacity: 0.25; }
        40% { opacity: 0.9; }
        41.5% { opacity: 0.15; }
        43% { opacity: 1; }
        78% { opacity: 1; }
        79% { opacity: 0.45; }
        80% { opacity: 1; }
      }

      @keyframes vcAmbientGlow {
        0%, 100% { opacity: 0.22; transform: scale(1); }
        50% { opacity: 0.36; transform: scale(1.06); }
      }

      .vc-animated-ambient {
        transform-origin: 400px 380px;
        animation: vcAmbientGlow 4s ease-in-out infinite;
      }

      .vc-animated-main-tubes {
        animation: vcPowerIgnition 1.6s ease-out forwards, vcNeonHum 3s ease-in-out infinite 1.6s;
      }

      .vc-animated-flicker-tube {
        animation: vcPowerIgnition 1.8s ease-out forwards, vcMicroFlicker 6s ease-in-out infinite 1.8s;
      }
    </style>
  </defs>

  <!-- Ambient background neon halo -->
  <ellipse class="vc-animated-ambient" cx="400" cy="380" rx="390" ry="310" fill="url(#vc-ambient-radial)" />

  <!-- 3D Black Drop Shadows (Authentic Arcade Sign Depth) -->
